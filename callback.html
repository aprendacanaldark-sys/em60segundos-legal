<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autorização | Em 60 Segundos</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;color:#1d2a2c}h1{color:#0f4c55}code{display:block;word-break:break-all;background:#f1f4f4;padding:14px;border-radius:8px;font-size:15px}</style></head>
<body><h1>Autorização recebida</h1>
<p id="msg">Copie o código abaixo e cole no n8n.</p>
<code id="code"></code>
<script>
const p = new URLSearchParams(location.search);
const c = p.get('code'), e = p.get('error_description') || p.get('error');
document.getElementById('code').textContent = c || '';
if (!c) document.getElementById('msg').textContent = e ? 'Erro: ' + e : 'Nenhum código recebido.';
</script>
<p><a href="index.html">Em 60 Segundos</a></p>
</body></html>
